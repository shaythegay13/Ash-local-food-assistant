<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ash – ingest</title>
<style>body{font:16px system-ui;max-width:560px;margin:20px auto;padding:0 14px}label{display:block;margin:10px 0}pre{background:#f3f3f3;padding:10px;white-space:pre-wrap}</style>
</head><body>
<h2>Ingest a fridge photo or flyer</h2>
<form id="f">
  <label>Source <select id="src" name="source_id"></select></label>
  <label>Kind <select name="kind"><option value="stock">Fridge / shelf photo (stock)</option><option value="flyer">Flyer / door sign (hours)</option></select></label>
  <label>When was the photo posted? <input type="datetime-local" name="observed_at"></label>
  <label><input type="file" name="image" accept="image/*" required></label>
  <button>Run</button>
</form>
<pre id="out"></pre>
<script>
fetch("/api/sources").then(r=>r.json()).then(list=>{
  document.getElementById("src").innerHTML = list.map(s=>`<option value="${s.id}">${s.name}</option>`).join("");
});
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  if (!fd.get("observed_at")) fd.delete("observed_at");
  document.getElementById("out").textContent = "Running…";
  const r = await fetch("/api/ingest", { method: "POST", body: fd });
  document.getElementById("out").textContent = JSON.stringify(await r.json(), null, 2);
};
</script>
</body></html>
